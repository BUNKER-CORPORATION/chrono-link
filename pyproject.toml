[build-system]
requires = ["setuptools==80.9.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chrono-link"
version = "0.1.0"
description = "Synthetic-data software foundation for Chrono Link EEG research"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "brainflow==5.22.2",
  "numpy>=2.4,<2.5",
  "scipy>=1.17,<1.18",
  "scikit-learn>=1.9,<1.10",
  "pyriemann>=0.12,<0.13",
  "matplotlib>=3.11,<3.12",
  "joblib>=1.5,<1.6",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pip-tools>=7.5,<8",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
chrono-stream = "chrono_link.cli.stream:main"
chrono-validate = "chrono_link.cli.validate:main"
chrono-train = "chrono_link.cli.train:main"
chrono-smoke = "chrono_link.cli.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chrono_link = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["chrono_link"]
