name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - run: python -m pip install --require-hashes -r locks/windows-py311-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff check src tests tools
      - run: mypy src
      - run: pytest --cov=chrono_link --cov-branch --cov-report=json
        env:
          MPLBACKEND: Agg
      - run: python tools/check_coverage.py
      - run: chrono-smoke --out-dir artifacts/smoke --windows 200
        env:
          MPLBACKEND: Agg
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: artifacts/smoke

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - run: python -m pip install --require-hashes -r locks/windows-py311-dev.txt
      - run: python -m build
      - run: python -m venv wheel-test
      - run: wheel-test/bin/python -m pip install --require-hashes -r locks/windows-py311-runtime.txt
      - run: wheel-test/bin/python -m pip install --no-deps dist/*.whl
      - run: wheel-test/bin/chrono-stream --help
      - run: wheel-test/bin/chrono-validate --help
      - run: wheel-test/bin/chrono-train --help
      - run: wheel-test/bin/chrono-smoke --help
