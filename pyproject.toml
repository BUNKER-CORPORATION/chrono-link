[build-system]
requires = ["setuptools==84.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chrono-link"
version = "0.1.0"
description = "Reproducible real-time EEG signal and decoder foundation for Chrono Link"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Bunker Corporation" }]
maintainers = [{ name = "Bunker Corporation" }]
keywords = [
  "brain-computer-interface",
  "brainflow",
  "eeg",
  "machine-learning",
  "signal-processing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "brainflow==5.22.2",
  # BrainFlow imports pkg_resources at runtime. Newer setuptools releases
  # removed that API, so this is an intentional compatibility boundary.
  "setuptools==84.0.0",
  "numpy>=2.4,<2.5",
  "scipy>=1.17,<1.18",
  "scikit-learn>=1.9,<1.10",
  "pyriemann>=0.12,<0.13",
  "matplotlib>=3.11,<3.12",
  "joblib>=1.5,<1.7",
]

[project.urls]
Changelog = "https://github.com/BUNKER-CORPORATION/chrono-link/blob/main/CHANGELOG.md"
Documentation = "https://github.com/BUNKER-CORPORATION/chrono-link/tree/main/docs"
Issues = "https://github.com/BUNKER-CORPORATION/chrono-link/issues"
Repository = "https://github.com/BUNKER-CORPORATION/chrono-link"

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pip-tools>=7.5,<8",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
chrono-stream = "chrono_link.cli.stream:main"
chrono-validate = "chrono_link.cli.validate:main"
chrono-train = "chrono_link.cli.train:main"
chrono-smoke = "chrono_link.cli.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chrono_link = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q -ra --strict-config --strict-markers"
minversion = "8.0"
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RSE", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["chrono_link"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["chrono_link"]
pretty = true
show_error_codes = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["chrono_link"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
